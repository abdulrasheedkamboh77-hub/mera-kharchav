name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create project files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {"name":"mera-kharcha","version":"1.4.0","private":true,"dependencies":{"@capacitor/android":"^6.2.0","@capacitor/core":"^6.2.0"},"devDependencies":{"@capacitor/cli":"^6.2.0"}}
          EOF
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.umair.kharcha","appName":"Mera Kharcha","webDir":"www"}
          EOF
      - name: Add Android
        run: |
          npm install
          npx cap add android
      - name: Add print support and signing key
        run: |
          D=android/app/src/main/java/com/umair/kharcha
          cat > $D/PrintPlugin.java <<'EOF'
          package com.umair.kharcha;

          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "PrintPlugin")
          public class PrintPlugin extends Plugin {
            @PluginMethod
            public void print(final PluginCall call) {
              getActivity().runOnUiThread(() -> {
                try {
                  PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                  WebView wv = getBridge().getWebView();
                  PrintDocumentAdapter adapter = wv.createPrintDocumentAdapter("Mera Kharcha Report");
                  pm.print("Mera Kharcha Report", adapter, new PrintAttributes.Builder().build());
                  call.resolve();
                } catch (Exception e) {
                  call.reject(e.getMessage());
                }
              });
            }
          }
          EOF
          cat > $D/MainActivity.java <<'EOF'
          package com.umair.kharcha;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(PrintPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          mkdir -p ~/.android
